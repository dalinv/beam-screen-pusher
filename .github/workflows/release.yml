# 光束录推 BeamScreenPusher —— GitHub Actions 发布流水线（见 发布规范.md §5 CI/CD）
# 打 tag v* 触发；Windows 产物经 electron-builder 发布到 GitHub Releases。
# macOS 构建在 macOS 采集（CoreGraphics）实现后启用，见 发布规范 §5.1 平台状态。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS + portable)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native capture module
        run: npm run build:native

      - name: Unit tests
        # 原生/集成/E2E 需真实桌面会话（GDI 采集），由本地与手工验收执行，见 测试报告.md
        run: npm run typecheck && npm run test:unit

      - name: Build
        run: npm run build

      - name: Build NSIS installer (publish)
        # 串行发布（先 NSIS 后 portable），避免 electron-builder 并行发布竞态产生重复 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win nsis --publish always

      - name: Build portable (publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win portable --publish always

      - name: Cleanup duplicate releases
        # 兜底：若仍出现重复 Release，保留资产最多的，删除其余
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cleanup-gh-releases.mjs

